<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 | Noah's Spieleportal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .grid-2048 {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            gap: 10px;
            background: rgba(233,69,96,0.1);
            padding: 10px;
            border-radius: 12px;
            border: 2px solid rgba(233,69,96,0.3);
        }
        .tile {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            transition: all 0.1s;
        }
        .tile-0 { background: rgba(255,255,255,0.03); }
        .tile-2 { background: #1a1a2e; color: #e0e0e0; border: 1px solid rgba(255,255,255,0.1); }
        .tile-4 { background: #16213e; color: #e0e0e0; }
        .tile-8 { background: #0f3460; color: #fff; }
        .tile-16 { background: #533483; color: #fff; }
        .tile-32 { background: #e94560; color: #fff; font-size: 1.4rem; }
        .tile-64 { background: #c73652; color: #fff; font-size: 1.4rem; }
        .tile-128 { background: #f5a623; color: #fff; font-size: 1.2rem; }
        .tile-256 { background: #f0932b; color: #fff; font-size: 1.2rem; }
        .tile-512 { background: #6ab04c; color: #fff; font-size: 1.1rem; }
        .tile-1024 { background: #4ecdc4; color: #fff; font-size: 1rem; }
        .tile-2048 { background: linear-gradient(135deg, #f5a623, #e94560); color: #fff; font-size: 1rem; box-shadow: 0 0 30px rgba(245,166,35,0.6); }
    </style>
</head>
<body class="game-page">
    <header class="game-header">
        <a href="../index.html" class="back-btn">← Zurück</a>
        <h1>🔢 2048</h1>
    </header>
    
    <div class="game-container">
        <div class="score-board">
            <div class="score-item">
                <div class="label">Score</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="label">Best</div>
                <div class="value" id="best">0</div>
            </div>
        </div>
        
        <div class="status-text" id="status"></div>
        <div class="grid-2048" id="grid2048"></div>
        <button class="btn" onclick="initGame()">🔄 Neues Spiel</button>
        <div style="color:#555; font-size:0.8rem; margin-top:12px;">Pfeiltasten zum Schieben</div>
    </div>

    <script>
        let board, score, best = 0;
        
        function initGame() {
            board = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('status').textContent = '';
            addTile();
            addTile();
            render();
        }
        
        function addTile() {
            const empty = [];
            board.forEach((row, r) => row.forEach((v, c) => { if (!v) empty.push([r,c]); }));
            if (!empty.length) return;
            const [r,c] = empty[Math.floor(Math.random() * empty.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
        }
        
        function move(dir) {
            let moved = false;
            const orig = JSON.stringify(board);
            
            const rotate = m => m[0].map((_, i) => m.map(r => r[i]).reverse());
            const rotateBack = m => m.map((_, i) => m.map(r => r[r.length-1-i]));
            
            function slideLeft(row) {
                let arr = row.filter(v => v);
                for (let i = 0; i < arr.length - 1; i++) {
                    if (arr[i] === arr[i+1]) {
                        arr[i] *= 2;
                        score += arr[i];
                        arr.splice(i+1, 1);
                    }
                }
                while (arr.length < 4) arr.push(0);
                return arr;
            }
            
            if (dir === 'left') board = board.map(slideLeft);
            else if (dir === 'right') board = board.map(r => slideLeft([...r].reverse()).reverse());
            else if (dir === 'up') board = rotateBack(board.map(slideLeft).map ? rotate(board).map(slideLeft) : []).map ? rotate(board).map(slideLeft) : board;
            else if (dir === 'down') {
                board = rotate(rotate(rotate(board))).map(slideLeft);
                board = rotate(board);
                board = rotate(board);
                board = rotate(board);
            }
            
            // Simpler approach for up/down
            if (dir === 'up' || dir === 'down') {
                board = JSON.parse(orig);
                for (let c = 0; c < 4; c++) {
                    let col = board.map(r => r[c]);
                    if (dir === 'down') col.reverse();
                    col = slideLeft(col);
                    if (dir === 'down') col.reverse();
                    board.forEach((r, i) => r[c] = col[i]);
                }
            } else if (dir === 'left' || dir === 'right') {
                board = JSON.parse(orig);
                board = board.map(row => {
                    if (dir === 'right') row = [...row].reverse();
                    row = slideLeft(row);
                    if (dir === 'right') row = row.reverse();
                    return row;
                });
            }
            
            if (JSON.stringify(board) !== orig) {
                addTile();
                if (score > best) {
                    best = score;
                    document.getElementById('best').textContent = best;
                }
                document.getElementById('score').textContent = score;
                
                if (board.flat().includes(2048)) {
                    document.getElementById('status').textContent = '🎉 2048 erreicht! Du hast gewonnen!';
                }
                
                if (!canMove()) {
                    document.getElementById('status').textContent = '💀 Game Over!';
                }
            }
            
            render();
        }
        
        function canMove() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (!board[r][c]) return true;
                    if (c < 3 && board[r][c] === board[r][c+1]) return true;
                    if (r < 3 && board[r][c] === board[r+1][c]) return true;
                }
            }
            return false;
        }
        
        function render() {
            const grid = document.getElementById('grid2048');
            grid.innerHTML = '';
            board.forEach(row => {
                row.forEach(val => {
                    const tile = document.createElement('div');
                    tile.className = `tile tile-${Math.min(val, 2048)}`;
                    tile.textContent = val || '';
                    grid.appendChild(tile);
                });
            });
        }
        
        document.addEventListener('keydown', e => {
            const map = { 'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down' };
            if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
        });
        
        // Touch support
        let touchStart = null;
        document.addEventListener('touchstart', e => touchStart = e.touches[0]);
        document.addEventListener('touchend', e => {
            if (!touchStart) return;
            const dx = e.changedTouches[0].clientX - touchStart.clientX;
            const dy = e.changedTouches[0].clientY - touchStart.clientY;
            if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
            else move(dy > 0 ? 'down' : 'up');
            touchStart = null;
        });
        
        initGame();
    </script>
</body>
</html>
