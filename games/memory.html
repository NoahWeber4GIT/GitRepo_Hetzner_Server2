<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory | Noah's Spieleportal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            gap: 10px;
            margin: 10px 0;
        }
        .memory-card {
            width: 90px;
            height: 90px;
            cursor: pointer;
            perspective: 600px;
        }
        .card-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }
        .memory-card.flipped .card-inner { transform: rotateY(180deg); }
        .memory-card.matched .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
        }
        .card-front {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid rgba(233,69,96,0.3);
            color: #e94560;
            font-size: 1.5rem;
        }
        .card-back {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 2px solid rgba(78,205,196,0.5);
            transform: rotateY(180deg);
        }
        .memory-card.matched .card-back {
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78,205,196,0.4);
        }
        .player-scores {
            display: flex;
            gap: 30px;
            margin-bottom: 16px;
        }
        .player-score {
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.1);
            text-align: center;
            transition: all 0.3s;
        }
        .player-score.active {
            border-color: #e94560;
            background: rgba(233,69,96,0.1);
        }
        .player-score .name { font-size: 0.8rem; color: #888; }
        .player-score .pts { font-size: 1.5rem; font-weight: 700; color: #e94560; }
    </style>
</head>
<body class="game-page">
    <header class="game-header">
        <a href="../index.html" class="back-btn">← Zurück</a>
        <h1>🧠 Memory</h1>
    </header>
    
    <div class="game-container">
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('1p')">👤 1 Spieler</button>
            <button class="mode-btn" onclick="setMode('2p')">👥 2 Spieler</button>
        </div>
        
        <div class="player-scores" id="playerScores">
            <div class="player-score active" id="score-p1">
                <div class="name">Spieler 1</div>
                <div class="pts" id="pts1">0</div>
            </div>
            <div class="player-score" id="score-p2" style="display:none;">
                <div class="name">Spieler 2</div>
                <div class="pts" id="pts2">0</div>
            </div>
        </div>
        
        <div class="status-text" id="status">Finde alle Paare!</div>
        <div class="memory-grid" id="grid"></div>
        <button class="btn" onclick="initGame()">🔄 Neues Spiel</button>
    </div>

    <script>
        const emojis = ['🦁','🐯','🦊','🐺','🦋','🌺','🍕','🎸','🚀','🌈','⚡','🎯','🏆','💎','🌙','🔥'];
        const pairs = emojis.slice(0, 8);
        
        let cards = [], flipped = [], matched = 0, moves = 0, lock = false;
        let mode = '1p', currentPlayer = 1, scores = [0, 0];
        
        function setMode(m) {
            mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('score-p2').style.display = m === '2p' ? 'block' : 'none';
            initGame();
        }
        
        function initGame() {
            matched = 0; moves = 0; flipped = []; lock = false;
            scores = [0, 0]; currentPlayer = 1;
            document.getElementById('pts1').textContent = '0';
            document.getElementById('pts2').textContent = '0';
            document.getElementById('status').textContent = mode === '2p' ? 'Spieler 1 ist dran' : 'Finde alle Paare!';
            updateActivePlayer();
            
            const shuffled = [...pairs, ...pairs].sort(() => Math.random() - 0.5);
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            cards = [];
            
            shuffled.forEach((emoji, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.emoji = emoji;
                card.dataset.index = i;
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">❓</div>
                        <div class="card-back">${emoji}</div>
                    </div>
                `;
                card.addEventListener('click', () => flipCard(card));
                grid.appendChild(card);
                cards.push(card);
            });
        }
        
        function flipCard(card) {
            if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            
            card.classList.add('flipped');
            flipped.push(card);
            
            if (flipped.length === 2) {
                lock = true;
                moves++;
                checkMatch();
            }
        }
        
        function checkMatch() {
            const [a, b] = flipped;
            
            if (a.dataset.emoji === b.dataset.emoji) {
                a.classList.add('matched');
                b.classList.add('matched');
                matched += 2;
                
                if (mode === '2p') {
                    scores[currentPlayer - 1]++;
                    document.getElementById(`pts${currentPlayer}`).textContent = scores[currentPlayer - 1];
                }
                
                flipped = [];
                lock = false;
                
                if (matched === cards.length) {
                    setTimeout(() => {
                        if (mode === '2p') {
                            const winner = scores[0] > scores[1] ? 'Spieler 1' : scores[1] > scores[0] ? 'Spieler 2' : 'Unentschieden';
                            document.getElementById('status').textContent = scores[0] === scores[1] ? '🤝 Unentschieden!' : `🏆 ${winner} gewinnt!`;
                        } else {
                            document.getElementById('status').textContent = `🎉 Fertig in ${moves} Zügen!`;
                        }
                    }, 300);
                }
            } else {
                setTimeout(() => {
                    a.classList.remove('flipped');
                    b.classList.remove('flipped');
                    flipped = [];
                    lock = false;
                    
                    if (mode === '2p') {
                        currentPlayer = currentPlayer === 1 ? 2 : 1;
                        document.getElementById('status').textContent = `Spieler ${currentPlayer} ist dran`;
                        updateActivePlayer();
                    }
                }, 900);
            }
        }
        
        function updateActivePlayer() {
            document.getElementById('score-p1').classList.toggle('active', currentPlayer === 1);
            document.getElementById('score-p2').classList.toggle('active', currentPlayer === 2);
        }
        
        initGame();
    </script>
</body>
</html>
