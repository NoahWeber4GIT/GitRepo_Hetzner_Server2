<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake | Noah's Spieleportal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        canvas { border: 2px solid rgba(233,69,96,0.5); border-radius: 8px; background: #0a0a15; }
        .high-score { color: #888; font-size: 0.9rem; margin-bottom: 8px; }
        .high-score span { color: #f5a623; font-weight: 700; }
    </style>
</head>
<body class="game-page">
    <header class="game-header">
        <a href="../index.html" class="back-btn">← Zurück</a>
        <h1>🐍 Snake</h1>
    </header>
    
    <div class="game-container">
        <div class="score-board">
            <div class="score-item">
                <div class="label">Score</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="label">Highscore</div>
                <div class="value" id="highscore">0</div>
            </div>
        </div>
        
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
        <div class="status-text" id="status" style="margin-top:16px;">Drücke LEERTASTE zum Starten</div>
        <button class="btn" onclick="resetGame()">🔄 Neues Spiel</button>
        <div class="controls-info" style="margin-top:12px; color:#555; font-size:0.8rem;">Pfeiltasten oder WASD zum Steuern</div>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const CELL = 20;
        const COLS = canvas.width / CELL;
        const ROWS = canvas.height / CELL;
        
        let snake, dir, nextDir, food, score, highscore, gameLoop, running;
        highscore = 0;
        
        function initGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            dir = {x: 1, y: 0};
            nextDir = {x: 1, y: 0};
            score = 0;
            running = false;
            document.getElementById('score').textContent = '0';
            spawnFood();
            draw();
        }
        
        function spawnFood() {
            do {
                food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }
        
        document.addEventListener('keydown', e => {
            const keys = {
                'ArrowUp': {x:0,y:-1}, 'w': {x:0,y:-1}, 'W': {x:0,y:-1},
                'ArrowDown': {x:0,y:1}, 's': {x:0,y:1}, 'S': {x:0,y:1},
                'ArrowLeft': {x:-1,y:0}, 'a': {x:-1,y:0}, 'A': {x:-1,y:0},
                'ArrowRight': {x:1,y:0}, 'd': {x:1,y:0}, 'D': {x:1,y:0},
            };
            
            if (e.key === ' ') {
                e.preventDefault();
                if (!running) startGame();
                return;
            }
            
            if (keys[e.key]) {
                e.preventDefault();
                const d = keys[e.key];
                if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
            }
        });
        
        function startGame() {
            if (running) return;
            running = true;
            document.getElementById('status').textContent = '';
            clearInterval(gameLoop);
            gameLoop = setInterval(update, 120);
        }
        
        function update() {
            dir = nextDir;
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            
            // Wall collision
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                endGame();
                return;
            }
            
            // Self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame();
                return;
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                if (score > highscore) {
                    highscore = score;
                    document.getElementById('highscore').textContent = highscore;
                }
                spawnFood();
            } else {
                snake.pop();
            }
            
            draw();
        }
        
        function endGame() {
            clearInterval(gameLoop);
            running = false;
            document.getElementById('status').textContent = `💀 Game Over! Score: ${score}`;
        }
        
        function resetGame() {
            clearInterval(gameLoop);
            initGame();
            document.getElementById('status').textContent = 'Drücke LEERTASTE zum Starten';
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < COLS; i++) {
                ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < ROWS; j++) {
                ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(canvas.width, j*CELL); ctx.stroke();
            }
            
            // Snake
            snake.forEach((seg, i) => {
                const alpha = 1 - (i / snake.length) * 0.6;
                ctx.fillStyle = i === 0 ? '#4ecdc4' : `rgba(78, 205, 196, ${alpha})`;
                ctx.beginPath();
                ctx.roundRect(seg.x*CELL+1, seg.y*CELL+1, CELL-2, CELL-2, 4);
                ctx.fill();
                
                // Eyes on head
                if (i === 0) {
                    ctx.fillStyle = '#0a0a15';
                    ctx.beginPath();
                    ctx.arc(seg.x*CELL + CELL*0.3, seg.y*CELL + CELL*0.3, 2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(seg.x*CELL + CELL*0.7, seg.y*CELL + CELL*0.3, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            });
            
            // Food
            ctx.fillStyle = '#e94560';
            ctx.shadowColor = '#e94560';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        initGame();
    </script>
</body>
</html>
